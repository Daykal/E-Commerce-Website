services:
  mongodb:
    image: mongo:8
    container_name: storegg_mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - storegg_mongodb_data:/data/db
      - storegg_mongodb_config:/data/configdb
    restart: unless-stopped
    networks:
      - npm-shared

  redis:
    image: redis:8-alpine
    container_name: storegg_redis
    ports:
      - "6380:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - storegg_redis_data:/data
    restart: unless-stopped
    networks:
      - npm-shared
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: storegg_minio
    ports:
      # - "9004:9000" # API port
      - "9001:9001" # Console port
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - storegg_minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped
    networks:
      - npm-shared

  gamestoregg-backend:
    build: ./backend
    container_name: storegg_backend
    restart: unless-stopped
    depends_on:
      - mongodb
      - redis
      - minio
    environment:
      PORT: 5000
      MONGO_URL_RAW: ${MONGO_URL_RAW}
      REDIS_URL: ${REDIS_URL}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      CLIENT_URL: ${CLIENT_URL}
      NODE_ENV: ${NODE_ENV}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}

    expose:
      - "5000"
    networks:
      - npm-shared

volumes:
  storegg_mongodb_data:
  storegg_mongodb_config:
  storegg_redis_data:
  storegg_minio_data:

networks:
  npm-shared:
    external: true
